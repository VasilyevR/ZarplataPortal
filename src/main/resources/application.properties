# --- WEB CONFIG ---
server.port=443
server.servlet.session.timeout=5m

# --- SSL CONFIG ---
server.ssl.enabled=true
server.ssl.key-store-type=PKCS12
server.ssl.key-store=${SSL_KEY_STORE_PATH}
server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD}

# --- DATABASE CONFIG ---
spring.jpa.hibernate.ddl-auto=update
hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/${BASENAME}?serverTimezone=Europe/Moscow&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${USERDBNAME}
spring.datasource.password=${USERDBPASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.data.jdbc.dialect=mysql


# --- APP SPECIFIC ---
app.share.folder.path=${SHARE_FOLDER_PATH}
app.salary.folder.path=${SALARY_FOLDER_PATH}
app.purchase.folder.path=${PURCHASE_FOLDER_PATH}
app.date.format=dd.MM.yy.

# --- I18N ---
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.cache-duration=3600

# --- LOGGING ---
logging.level.waffle=TRACE
logging.level.org.springframework.security=DEBUG

# --- WAFFLE (SSO) ---
waffle.sso.enabled=true
waffle.sso.protocols=NTLM
waffle.sso.basic-enabled=false
waffle.exclude.urls=/purchase-orders/generate

# --- SECURITY ---
security.ignoring.urls=/error,/favicon.ico,/css/**,/js/**,/images/**,/actuator/health

spring.thymeleaf.cache=false

# --- JETTY CONFIG ---
server.jetty.max-http-form-post-size=5000000
server.tomcat.max-http-form-post-size=5000000
