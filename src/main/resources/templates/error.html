<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts :: head(#{error.title})}">
</head>
<body>

<nav th:replace="~{layouts :: header}"></nav>

<div class="container text-center mt-5">
    <h1 class="text-danger" th:text="#{error.header}">Oops! Something went wrong.</h1>

    <div class="message mt-4 fs-5">
        <p th:if="${error}" th:text="${error}"></p>
        <p th:unless="${error}" th:text="#{error.default.message}">An unexpected error occurred.</p>
        <p th:if="${status}" th:text="#{error.status(${status})}">Status Code: 000</p>
    </div>

    <a href="/" class="btn btn-secondary mt-4" th:text="#{error.home.button}">Go to Home</a>
</div>

<div th:replace="~{layouts :: footer}"></div>
</body>
</html>
