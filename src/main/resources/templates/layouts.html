<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <title th:text="${title}">Zarplata Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding-top: 70px; }
        .navbar { background-color: #e3f2fd; } /* Light Blue background */
        .nav-link { font-weight: bold; font-size: 1.1rem; } /* Bold and slightly larger nav items */
    </style>
</head>
<body>

<nav class="navbar navbar-expand-md navbar-light fixed-top" th:fragment="header">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold fs-4" href="/" th:text="#{navbar.brand}">Officegid Portal</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse" aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarCollapse">
            <ul class="navbar-nav me-auto mb-2 mb-md-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/salary}" th:text="#{navbar.salary}">Salary</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/purchase-orders}" th:text="#{navbar.purchase}">Purchase</a>
                </li>
            </ul>
            <span class="navbar-text" sec:authorize="isAuthenticated()">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person-fill" viewBox="0 0 16 16">
                  <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1H3zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
                </svg>
                <span sec:authentication="name" class="fw-bold">User</span>
            </span>
        </div>
    </div>
</nav>

<div th:fragment="footer">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</div>

</body>
</html>
