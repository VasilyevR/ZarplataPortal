<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layouts :: head(#{salary.title})}"></head>
<body>

<nav th:replace="~{layouts :: header}"></nav>

<div class="container-fluid mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1><i class="bi bi-cash-stack"></i> <span th:text="#{salary.title}">Salary</span></h1>
        
        <div sec:authorize="hasAuthority('USER_MANAGER')" class="col-md-4">
            <form th:action="@{/salary}" method="get" class="input-group">
                <span class="input-group-text" th:text="#{salary.select.user}">User:</span>
                &lt;select name="user" class="form-select" onchange="this.form.submit()">
                    <option th:each="u : ${users}" 
                            th:value="${u.login}" 
                            th:text="${u.login}" 
                            th:selected="${u.login == selectedUsername}"></option>
                &lt;/select>
            </form>
        </div>
    </div>

    <div th:if="${salaryData.isEmpty()}" class="alert alert-info">
        <i class="bi bi-info-circle"></i> <span th:text="#{salary.no.data}">No salary data found.</span>
    </div>

    <div class="accordion shadow-sm" id="salaryAccordion">
        <div th:each="month : ${salaryData}" class="accordion-item">
            <h2 class="accordion-header">
                <button class="accordion-button" 
                        th:classappend="${monthStat.last} ? '' : 'collapsed'" 
                        type="button" 
                        data-bs-toggle="collapse" 
                        th:data-bs-target="'#collapse-' + ${monthStat.index}"
                        aria-expanded="true" 
                        th:aria-controls="'collapse-' + ${monthStat.index}">
                    <div class="d-flex justify-content-between w-100 me-3">
                        <strong>
                            <span th:text="${month.monthName}">Month</span>
                            <span th:if="${month.year != null}" th:text="', ' + ${month.year}">, 2026</span>
                        </strong>
                        <span class="badge bg-success rounded-pill">
                            <span th:text="${#numbers.formatDecimal(month.totalAmount, 1, 'WHITESPACE', 2, 'COMMA')}">0,00</span> 
                            <span th:text="#{salary.currency}">rub.</span>
                        </span>
                    </div>
                </button>
            </h2>
            <div th:id="'collapse-' + ${monthStat.index}" 
                 class="accordion-collapse collapse" 
                 th:classappend="${monthStat.last} ? 'show' : ''" 
                 data-bs-parent="#salaryAccordion">
                <div class="accordion-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover table-bordered mb-0 small">
                            <thead class="table-light">
                                <tr>
                                    <th th:each="col : ${columns}" th:text="${col.columnName}">Column</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="row : ${month.rows}">
                                    <td th:each="col : ${columns}" 
                                        th:text="${row.columnValues.get(col.excelColIndex)}"
                                        th:style="${row.columnColors.containsKey(col.excelColIndex)} ? 'background-color: ' + ${row.columnColors.get(col.excelColIndex)} : ''">
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{layouts :: footer}"></div>
</body>
</html>
