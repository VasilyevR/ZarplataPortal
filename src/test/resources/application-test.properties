# --- WEB CONFIG ---
server.port=0

# --- SSL CONFIG ---
server.ssl.enabled=false
server.ssl.key-store-type=PKCS12
server.ssl.key-store=classpath:KeyStore.jks
server.ssl.key-store-password=123456

# --- DATABASE CONFIG ---
spring.jpa.hibernate.ddl-auto=update
hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.datasource.url=jdbc:mysql://localhost:3306/${BASENAME}?serverTimezone=Europe/Moscow&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${USERDBNAME}
spring.datasource.password=${USERDBPASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.data.jdbc.dialect=mysql


# --- APP SPECIFIC ---
app.share.folder.path=./target
app.salary.folder.path=./
app.purchase.folder.path=./

# --- I18N ---
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.cache-duration=3600

# --- LOGGING ---
logging.level.waffle=TRACE
logging.level.org.springframework.security=DEBUG

# --- WAFFLE (SSO) ---
waffle.sso.enabled=true
waffle.sso.protocols=NTLM
waffle.sso.basic-enabled=false

spring.thymeleaf.cache=false
